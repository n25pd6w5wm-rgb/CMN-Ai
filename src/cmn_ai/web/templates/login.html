<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>cmn·ai — sign in</title>
    <link rel="icon" href="/static/icons/icon-192.png" />
    <meta name="theme-color" content="#0c0d10" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/chat.css?v={{ css_v }}" />
    <script>try{var t=localStorage.getItem("cmn-theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
  </head>
  <body>
    <div class="auth-wrap">
      <div class="auth-card">
        <div class="auth-brand">
          <div class="brand-mark" aria-label="CMN ai">{% include "_logo.svg" %}</div>
          <p class="brand-sub">the conductor</p>
        </div>

        <div class="auth-tabs">
          <button class="auth-tab active" data-mode="login" type="button">Anmelden</button>
          <button class="auth-tab" data-mode="signup" type="button">Konto erstellen</button>
        </div>

        <form id="auth-form">
          <input id="email" type="email" placeholder="E-Mail" autocomplete="email" required />
          <input
            id="password"
            type="password"
            placeholder="Passwort"
            autocomplete="current-password"
            minlength="6"
            required
          />
          <button type="submit" id="auth-submit">Anmelden</button>
          <p class="auth-msg" id="auth-msg" role="status"></p>
          <button type="button" class="auth-link" id="forgot">Passwort vergessen?</button>
        </form>
      </div>
      <p class="auth-foot">Cost-governed multi-AI · local-first</p>
    </div>

    <script>
      "use strict";
      let mode = "login";
      const $ = (s) => document.querySelector(s);

      document.getElementById("forgot").addEventListener("click", async () => {
        const email = $("#email").value.trim();
        const msg = $("#auth-msg");
        if (!email) {
          msg.className = "auth-msg error";
          msg.textContent = "Gib oben deine E-Mail-Adresse ein, dann schicken wir dir einen Reset-Link.";
          return;
        }
        await fetch("/api/auth/recover", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email }),
        }).catch(() => {});
        msg.className = "auth-msg ok";
        msg.textContent = "Wenn die Adresse ein Konto hat, ist ein Reset-Link unterwegs (auch im Spam nachsehen).";
      });
      const submit = $("#auth-submit");
      const msg = $("#auth-msg");

      document.querySelectorAll(".auth-tab").forEach((tab) => {
        tab.addEventListener("click", () => {
          mode = tab.dataset.mode;
          document.querySelectorAll(".auth-tab").forEach((t) => t.classList.remove("active"));
          tab.classList.add("active");
          submit.textContent = mode === "login" ? "Anmelden" : "Konto erstellen";
          $("#password").autocomplete = mode === "login" ? "current-password" : "new-password";
          msg.textContent = "";
          msg.className = "auth-msg";
        });
      });

      $("#auth-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        msg.textContent = "";
        msg.className = "auth-msg";
        submit.disabled = true;
        const body = JSON.stringify({ email: $("#email").value, password: $("#password").value });
        try {
          const resp = await fetch(`/api/auth/${mode}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body,
          });
          const data = await resp.json().catch(() => ({}));
          if (!resp.ok) {
            msg.textContent = data.detail || "Something went wrong.";
            msg.className = "auth-msg error";
          } else if (mode === "signup" && data.confirm_email) {
            msg.textContent = "Check your email to confirm your account, then log in.";
            msg.className = "auth-msg ok";
          } else {
            window.location.href = "/";
            return;
          }
        } catch (err) {
          msg.textContent = "Network error — please try again.";
          msg.className = "auth-msg error";
        }
        submit.disabled = false;
      });
    </script>
  </body>
</html>
