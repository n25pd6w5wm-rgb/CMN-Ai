# Base configuration shared by all profiles. Profile files (mac.yaml, pi.yaml)
# are deep-merged on top of this. API keys are referenced by env-var name only.

ollama_host: "http://localhost:11434"

budget:
  monthly_budget_eur: 35.0
  bucket_split:
    general: 0.6
    coding: 0.4
  on_limit: block

router:
  strategy: mlx             # "rule" (heuristic) or "mlx" (trained Dirigent)
  optimizer_model: "gemma4:latest"
  synthesize: false
  base_model: "mlx-community/gemma-3-1b-it-4bit"
  adapter_path: "~/.cmn-ai/router-adapter-gemma3-1b"
  max_new_tokens: 48

storage:
  db_path: "~/.cmn-ai/cmn.db"

agents:
  local:
    enabled: true
    model: "gemma4:latest"
    bucket: general
  anthropic:
    enabled: false
    model: "claude-sonnet-5" # Claude Sonnet 5 (current); price in budget/pricing.py
    bucket: general
    api_key_env: "ANTHROPIC_API_KEY"
  coding:
    enabled: false
    model: "claude-sonnet-5" # Claude Sonnet 5 (current); price in budget/pricing.py
    escalate_model: "claude-opus-4-8"
    bucket: coding
    api_key_env: "ANTHROPIC_API_KEY"
  openai:
    enabled: false
    model: "gpt-5.4-mini" # good, affordable current GPT tier
    bucket: general
    api_key_env: "OPENAI_API_KEY"
  gemini:
    enabled: false
    model: "gemini-3.5-flash" # current good, affordable Gemini
    bucket: general
    api_key_env: "GEMINI_API_KEY"
  perplexity:
    enabled: false
    model: "sonar-pro"
    bucket: general
    api_key_env: "PERPLEXITY_API_KEY"
