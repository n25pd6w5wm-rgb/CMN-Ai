# macOS development profile. Gemma runs locally via Ollama; Gemma 4 e4b is the
# preferred local model here (pull it with: ollama pull gemma4:e4b). If it is not
# pulled, the agent automatically falls back to whatever Gemma the host has —
# e.g. an existing gemma3:4b keeps working (see agents/local.py).

agents:
  local:
    model: "gemma4:e4b"
