# Render (hosted frontend) profile, selected via CMN_AI_PROFILE=render.
#
# The local model runs on the Raspberry Pi and is reached over the network via the
# OLLAMA_HOST env var (see render.yaml). Routing uses the deterministic rule router so
# the container needs no model files; switch to "ollama" if the Pi serves the trained
# cmn-dirigent. The database lives on the mounted persistent disk at /data.
router:
  strategy: rule

# Public (client-side) Supabase values — the login wall + per-user conversations
# come up without any manual Render dashboard step. The secret SUPABASE_KEY
# (loads model API keys, bypasses RLS) stays env-only and is never committed.
supabase_url: "https://gamrqvueirvkjsksbsar.supabase.co"
supabase_anon_key: "sb_publishable_FHFlcz7xBBodhhraCGsnkA_gD3vINGe"

storage:
  db_path: "/data/cmn.db"

agents:
  local:
    model: "gemma3:1b" # must match the model pulled on the Pi (scripts/install-pi.sh)
